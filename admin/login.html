<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/login.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body data-page="admin-login">
  <main class="page-shell">
    <section class="form-card">
      <h1 class="page-title">تسجيل الدخول</h1>
      <p class="page-subtitle">لوحة المشرف — Mock Mode</p>
      <form id="admin-login-form" class="login-form" novalidate>
        <div class="form-group">
          <label class="label" for="username">اسم المستخدم</label>
          <input class="input" id="username" type="text" placeholder="اسم المستخدم" required>
        </div>
        <div class="form-group">
          <label class="label" for="password">كلمة المرور</label>
          <input class="input" id="password" type="password" placeholder="كلمة المرور" required>
        </div>
        <button class="btn btn-primary" type="submit">دخول</button>
        <p class="helper-text" id="loginError" role="alert"></p>
      </form>
    </section>
  </main>
  <div id="global-loader" class="loader">جاري التحميل...</div>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
