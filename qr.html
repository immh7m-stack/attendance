<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء QR</title>
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; }
    .card { max-width: 640px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .grid { display: grid; gap: 12px; }
    input, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; }
    #qrOutput { margin-top: 16px; text-align: center; }
    img { max-width: 220px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>إنشاء QR للجلسة</h1>
    <p>أدخل معرف الجلسة أو استخدم الرابط الافتراضي ثم أنشئ QR.</p>
    <div class="grid">
      <input id="sessionInput" value="session-demo-001" placeholder="مثال: session-demo-001" />
      <button id="generateBtn">إنشاء QR</button>
    </div>
    <div id="qrOutput"></div>
  </main>

  <script>
    const generateBtn = document.getElementById('generateBtn');
    const sessionInput = document.getElementById('sessionInput');
    const qrOutput = document.getElementById('qrOutput');

    async function generateQR(text) {
      const url = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(text)}`;
      const img = document.createElement('img');
      img.src = url;
      img.alt = 'QR Code';
      qrOutput.innerHTML = '';
      qrOutput.appendChild(img);
      const link = document.createElement('p');
      link.innerHTML = `<a href="${text}" target="_blank">فتح الرابط</a>`;
      qrOutput.appendChild(link);
    }

    generateBtn.addEventListener('click', () => {
      const sessionId = sessionInput.value.trim();
      if (!sessionId) return;
      const studentUrl = `https://immh7m-stack.github.io/attendance/student/?session=${encodeURIComponent(sessionId)}`;
      generateQR(studentUrl);
    });

    generateQR(`https://immh7m-stack.github.io/attendance/student/?session=${encodeURIComponent(sessionInput.value.trim() || 'session-demo-001')}`);
  </script>
</body>
</html>
